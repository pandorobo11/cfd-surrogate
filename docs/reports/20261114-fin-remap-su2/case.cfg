% 全遊動翼単体 Euler, Mach 2。翼は対称面 (y=0) に取り付け。舵軸は y 軸に平行で x=0.45。
% AOA は基準格子のケースで 5.0 または 10.0、舵角付き格子のケースで 0.0 にする。
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
MACH_NUMBER= 2.0
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
REF_DIMENSIONALIZATION= DIMENSIONAL
REF_ORIGIN_MOMENT_X= 0.45
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 0.6
MARKER_EULER= ( fin )
MARKER_SYM= ( sym )
MARKER_FAR= ( far )
MARKER_PLOTTING= ( fin )
MARKER_MONITORING= ( fin )
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
LIMITER_ITER= 400
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.2, 5.0, 50.0 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 10
MGLEVEL= 0
ITER= 3000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 10
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_WRT_FREQ= 3000
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV, SURFACE_PARAVIEW )
% 表面CSVから Pressure_Coefficient を読むため、コンパクト出力にしない
WRT_RESTART_COMPACT= NO
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF, CFL_NUMBER, LINEAR_SOLVER, NONPHYSICAL_POINTS )
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, LIFT, DRAG, MOMENT_Y, AVG_CFL )
SCREEN_WRT_FREQ_INNER= 50
